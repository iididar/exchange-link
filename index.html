<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exchange App">
  <meta name="theme-color" content="#11100d">
  <title>نرخی دراوەکان - Exchange App</title>

  <!-- ئایکۆنی بەرنامەکە -->
  <link id="faviconLink" rel="icon" type="image/jpeg" href="IMG_6140.jpg">
  <link id="appleIconLink" rel="apple-touch-icon" href="IMG_6140.jpg">
  <link rel="manifest" href="manifest.json">

  <!-- فایلی دیزاین -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشەی ئینترۆ (IMG_6165) -->
  <div id="introOverlay" class="intro-overlay">
    <img id="introImg" class="intro-img" alt="Exchange App Intro" style="display: none;">
  </div>

  <!-- پەڕەی مۆدێرنی ناو Hamburger Icon -->
  <div id="menuBackdrop" class="menu-backdrop">
    <div class="menu-sheet" id="menuSheet">
      <div class="menu-header">
        <span id="menuTitle" class="menu-title">ڕێکخستنەکان</span>
        <button id="menuCloseBtn" class="menu-close-btn" aria-label="Close">✕</button>
      </div>

      <!-- دەستەواژەی یەکەم: ڕاست = کوژاوە (Off) | چەپ = کارا (On) -->
      <div id="discountSettingRow" class="menu-item">
        <div id="discountText" class="menu-item-text">کاراکردنی ١٠٠٠دینار کەمتر بۆ وەرگرتنی دۆلار</div>
        <label class="toggle-switch">
          <input type="checkbox" id="discountToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- دەستەواژەی دووەم: ڕاست = کوژاوە (Off) | چەپ = کارا (On) -->
      <div class="menu-item">
        <div id="darkModeText" class="menu-item-text">دۆخی تاریك</div>
        <label class="toggle-switch">
          <input type="checkbox" id="darkModeToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="language-selector-box">
        <div id="languageSelectorLabel" class="currency-selector-label">زمان</div>
        <div class="language-row" role="group" aria-labelledby="languageSelectorLabel">
          <button class="language-select-btn active" type="button" data-lang="ku">کوردی</button>
          <button class="language-select-btn" type="button" data-lang="ar">عەرەبی</button>
          <button class="language-select-btn" type="button" data-lang="en">English</button>
        </div>
      </div>

      <!-- بەشی هەڵبژاردنی دراوەکان (٣ لە سەرەوە + ٢ لە خوارەوە) -->
      <div class="currency-selector-box">
        <div id="currencySelectorLabel" class="currency-selector-label">هەڵبژاردنی دراو</div>
        <div class="currency-row">
          <button class="curr-select-btn active" data-curr="USD">دۆلار</button>
          <button class="curr-select-btn" data-curr="GBP">پاوەند</button>
          <button class="curr-select-btn" data-curr="EUR">یۆرۆ</button>
        </div>
        <div class="currency-row bottom-row">
          <button class="curr-select-btn" data-curr="TRY">لیرەی تورکی</button>
          <button class="curr-select-btn" data-curr="IRR">تمەنی ئێرانی</button>
        </div>
      </div>

      <!-- بەشی خوارەوەی لیستەکە -->
      <div id="menuFooter" class="menu-footer">Developed by (Didar Ahmad)</div>
    </div>
  </div>

  <div class="app-container">
    <div class="top-bar">
      <!-- لینکی واتسئەپ لەسەر واژووەکەت (IMG_6071) -->
      <a id="signatureLink" href="https://wa.me/9647700068269" target="_blank" rel="noopener noreferrer" class="signature-link" title="پەیوەندی لە ڕێگەی واتسئەپ">
        <img id="signatureImg" class="signature-img" alt="Didar Ahmad Signature" style="display: none;">
        <svg id="fallbackSig" class="signature-fallback" viewBox="0 0 140 50" fill="none">
          <path d="M15 38C8 35 12 18 28 14C40 11 35 32 20 36C12 38 45 22 52 12C55 18 48 32 52 34C58 36 68 18 75 10C72 22 68 35 72 38C78 40 92 22 105 20C95 24 85 28 125 22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <!-- بەشی لای ڕاست: Hamburger و Refresh لە سەروو بەروارەکە -->
      <div class="top-right-group">
        <div class="top-actions-row">
          <button id="refreshBtn" class="refresh-btn" aria-label="Refresh" title="نوێکردنەوەی نرخەکان">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 3v5h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 21v-5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button id="metalsBtn" class="refresh-btn metals-btn" aria-label="Precious metals" title="زێـڕ و زیـو">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3 3.5 8v8L12 21l8.5-5V8L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="m3.8 8.2 8.2 4.9 8.2-4.9M12 13.1V21M8 5.4l8.4 5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </button>

          <button id="hamburgerBtn" class="hamburger-btn" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>

        <div class="datetime-box">
          <div id="dateDisplay" title="گرتە بکە بۆ بینینی ڕۆژ">2026/10/29</div>
          <div id="timeDisplay" class="time-text">01:25 PM</div>
        </div>
      </div>
    </div>

    <div class="rate-header">
      <h1 id="rateTitle" class="rate-title">نرخی دۆلار</h1>
      <div id="liveRateBanner" class="rate-banner">100$ = 168,150 دینار</div>
    </div>

    <div class="converter-section">
      <div class="currency-card active-input">
        <div id="topAmount" class="amount-display">0</div>
        <button id="topCurrencyToggle" class="currency-info currency-label-button" type="button" aria-label="Change secondary currency">
          <span id="topName" class="currency-name">دۆلار</span>
          <span id="topSymbol" class="currency-symbol">$</span>
        </button>
      </div>

      <button id="swapBtn" class="swap-btn" aria-label="Swap">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M7 20V4M7 4L3 8M7 4L11 8M17 4V20M17 20L21 16M17 20L13 16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="currency-card">
        <div id="bottomAmount" class="amount-display">0</div>
        <button id="bottomCurrencyToggle" class="currency-info currency-label-button" type="button" aria-label="Change secondary currency">
          <span id="bottomName" class="currency-name">دینار</span>
          <span id="bottomSymbol" class="currency-symbol">IQD</span>
        </button>
      </div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key-btn" data-key="7">7</button>
      <button class="key-btn" data-key="8">8</button>
      <button class="key-btn" data-key="9">9</button>
      <button class="key-btn" data-key="4">4</button>
      <button class="key-btn" data-key="5">5</button>
      <button class="key-btn" data-key="6">6</button>
      <button class="key-btn" data-key="1">1</button>
      <button class="key-btn" data-key="2">2</button>
      <button class="key-btn" data-key="3">3</button>
      <button class="key-btn transparent" data-key=".">.</button>
      <button class="key-btn" data-key="0">0</button>
      <button class="key-btn transparent" data-key="BACKSPACE">
        <svg width="28" height="22" viewBox="0 0 28 22" fill="none">
          <path d="M10 2L2 11L10 20H25C25.5523 20 26 19.5523 26 19V3C26 2.44772 25.5523 2 25 2H10Z" stroke="#f5a623" stroke-width="2" stroke-linejoin="round"/>
          <path d="M15 8L21 14M21 8L15 14" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <section id="metalsView" class="metals-view" aria-label="Precious metals" hidden>
      <div class="metals-heading" role="tablist" aria-label="Precious metals">
        <span class="tab-glider" aria-hidden="true"></span>
        <button id="goldTab" class="metal-tab active" type="button" role="tab" aria-controls="metalPriceList" aria-selected="true">نرخی زێـڕ</button>
        <button id="silverTab" class="metal-tab" type="button" role="tab" aria-controls="metalPriceList" aria-selected="false">نرخی زیـو</button>
      </div>
      <div id="metalsStatus" class="metals-status" role="status" aria-live="polite"></div>
      <div id="metalPriceList" class="metal-price-list"></div>
    </section>
  </div>

  <!-- فایلی جاڤاسکریپت -->
  <script src="script.js" defer></script>
</body>
</html>
